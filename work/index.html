<style>
@font-face { font-family: 'MW'; src: url('../fonts/PPMonumentWide-Regular.otf'); font-display: swap; }
@font-face { font-family: 'MN'; src: url('../fonts/PPMonumentNormal-Regular.otf'); font-display: swap; }
:root { --red: #F12009; --w: #FCFCFC; --grey: #6E6660; --blue: #7ECAE4; --pad: clamp(16px, 4vw, 64px); }
* { box-sizing: border-box; }
html { background: var(--red); }
body { margin: 0; background: var(--red); color: var(--w); font-family: 'MN', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
a, button { -webkit-tap-highlight-color: transparent; }
a:focus:not(:focus-visible), button:focus:not(:focus-visible) { outline: none; }
.paper { background: var(--red) url(../img/papel-rojo.webp) center / 627px; }

/* progress + top bar */
.prog { position: fixed; inset: 0 0 auto; height: 3px; z-index: 30; background: var(--w); transform-origin: 0 50%; transform: scaleX(0); }

/* hero */
.hero { min-height: calc(100svh - 64px); display: grid; grid-template-rows: 1fr auto auto; padding-top: 40px; overflow: hidden; position: relative; }
.wall { display: grid; gap: 14px; align-content: center; transform: rotate(-6deg) scale(1.2); opacity: .95; }
.wall .row { display: flex; gap: 12px; width: max-content; animation: run 60s linear infinite; }
.wall .row:nth-child(2) { animation-direction: reverse; animation-duration: 75s; }
.wall .row img { height: clamp(130px, 25vh, 280px); width: auto; border-radius: 16px; display: block; }
@keyframes run { to { transform: translateX(-50%); } }
.hero::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 45% at 50% 50%, rgb(241 32 9 / .7), rgb(241 32 9 / .15) 75%, transparent); pointer-events: none; }
.hero h1 { z-index: 2; position: absolute; inset: 0; display: grid; place-content: center; text-align: center; margin: 0; pointer-events: none;
  font: 400 clamp(32px, 11vw, 230px)/.86 'MW', system-ui; text-transform: uppercase; color: var(--red); letter-spacing: 0; }
.hero h1 span { display: block; width: fit-content; margin: 0 auto; padding: .06em .14em .02em; border-radius: .08em; background: var(--blue); color: var(--red); rotate: -3deg; transform: translateY(40%) scale(.9); opacity: 0; animation: up 1.1s cubic-bezier(.2, .8, .2, 1) forwards; }
.hero h1 span:nth-child(2) { rotate: 2deg; margin-top: -.04em; animation-delay: .12s; }
@keyframes up { to { transform: none; opacity: 1; } }
.hero p, .chips { position: relative; z-index: 2; }
.hero p { color: var(--w); font: 12px 'MW', system-ui; text-transform: uppercase; letter-spacing: .14em; margin: 0; padding: 18px var(--pad) 0; text-align: center; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 18px var(--pad) 44px; margin-bottom: -20px; justify-content: center; }
.chips::-webkit-scrollbar { display: none; }
.chips button { all: unset; cursor: pointer; flex: none; font: 11px 'MW', system-ui; text-transform: uppercase; letter-spacing: .12em; background: var(--blue); color: var(--red); box-shadow: 0 12px 26px -10px rgb(20 70 90 / .55); border-radius: 99px; padding: 12px 16px; }
.chips button.on { background: var(--w); color: var(--red); }
@media (max-width: 760px) { .chips { justify-content: flex-start; } }

/* one project = one screen, alternating blue / red */
.pj { padding: clamp(36px, 6vh, 64px) 0 clamp(24px, 4vh, 44px); display: grid; gap: clamp(10px, 1.8vh, 18px); position: relative; overflow: hidden; }
.pj[hidden] { display: none; }
.pj.alt { background: var(--blue); color: var(--red); }
.ttl { overflow: hidden; white-space: nowrap; }
.ttl div { display: inline-flex; width: max-content; animation: run var(--t, 22s) linear infinite; }
.ttl h2 { font: 400 clamp(60px, 11vw, 200px)/.95 'MW', system-ui; text-transform: uppercase; margin: 0; padding-right: .35em; }
.ttl h2::after { content: ''; display: inline-block; width: .62em; height: .62em; vertical-align: .08em; margin-left: .35em; background: url(../img/ast/chrome.webp) center / contain no-repeat; animation: spin 9s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.pj-h { padding: 0 var(--pad); display: grid; justify-items: start; gap: 14px; }
.pj-h .g { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; margin: 0; }
.pj .g { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.pj .g span { font: 12px 'MW', system-ui; text-transform: uppercase; letter-spacing: .16em; }
.pj .g span + span::before { content: ''; display: inline-block; width: 12px; height: 12px; margin: 0 10px 0 12px; vertical-align: -1px; background: url(../img/ast/chrome.webp) center / contain no-repeat; }
.pj .note { margin: 0; padding: 0 var(--pad); font: 400 clamp(18px, 2vw, 30px)/1.2 'MW', system-ui; text-transform: uppercase; max-width: 30ch; }
.pj .open { position: relative; display: inline-flex; align-items: center; justify-content: center; height: 42px; aspect-ratio: 1719 / 385; font: 10px 'MW', system-ui; text-transform: uppercase; letter-spacing: .14em; text-decoration: none; white-space: nowrap; color: #1b1b1b; text-shadow: 0 1px 0 rgb(255 255 255 / .6); background: url(../img/ast/pill-silver.webp) center / contain no-repeat; filter: drop-shadow(0 10px 16px rgb(40 0 0 / .3)); transition: transform .2s; }
.pj button.open { border: 0; padding: 0; cursor: pointer; }
.pj .case { padding: 0 var(--pad); display: grid; gap: 14px; justify-items: start; max-width: 62ch; }
.pj .case[hidden] { display: none; }
.pj .case p { margin: 0; font: 400 clamp(16px, 1.4vw, 20px)/1.45 'MW', system-ui; }
.pj .case .site { font: 11px 'MW', system-ui; text-transform: uppercase; letter-spacing: .14em; text-decoration: none; border-radius: 99px; padding: 13px 18px; background: var(--w); color: var(--red); }
.pj.alt .case .site { background: var(--red); color: var(--w); }
.pj .open:hover { transform: scale(1.04); }
.strip { display: flex; gap: clamp(10px, 1.4vw, 20px); overflow-x: auto; scroll-snap-type: x mandatory; padding: 30px var(--pad) 90px; margin: -24px 0 -60px; scroll-padding: 0 var(--pad); scrollbar-width: none; align-items: flex-start; }
.strip::-webkit-scrollbar { display: none; }
.strip.drag { scroll-snap-type: none; }
@media (max-width: 760px) { .strip { overflow-y: hidden; transition: height .35s ease; } }
.strip figure { margin: 0; flex: none; scroll-snap-align: start; border-radius: 22px; overflow: hidden; box-shadow: 0 34px 60px -30px rgb(80 10 0 / .6); position: relative; }
.strip img, .strip video { height: clamp(300px, 58svh, 760px); width: auto; max-width: 92vw; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
.pj.full .strip figure { width: calc(100vw - 2 * var(--pad)); height: 78svh; }
.pj.full .strip video { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
.fs { all: unset; cursor: pointer; position: absolute; right: 14px; bottom: 14px; z-index: 2; font: 10px 'MW', system-ui; text-transform: uppercase; letter-spacing: .12em; background: var(--w); color: var(--red); border-radius: 99px; padding: 12px 16px; }
.snav { display: flex; align-items: center; gap: 6px; padding: 0 var(--pad); margin-top: 6px; }
.sbar { flex: 1; height: 2px; position: relative; overflow: hidden; background: rgb(252 252 252 / .35); }
.pj.alt .sbar { background: rgb(241 32 9 / .25); }
.sbar b { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: currentColor; transition: width .3s; }
.sn { font: 11px 'MW', system-ui; letter-spacing: .12em; margin: 0 6px 0 10px; }
.sc { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: inherit; }
.sc::before { content: ''; width: 11px; height: 11px; border-top: 2px solid currentColor; border-right: 2px solid currentColor; transform: translateX(-2px) rotate(45deg); }
.sc.prev::before { transform: translateX(2px) rotate(-135deg); }
.sc[disabled] { opacity: .35; cursor: default; }
.strip figure.vid::after { content: '▶ Video'; position: absolute; left: 14px; top: 14px; font: 10px 'MW', system-ui; text-transform: uppercase; letter-spacing: .14em; background: var(--red); color: var(--w); border-radius: 99px; padding: 8px 12px; }

/* custom drag cursor (desktop) */
.cur { position: fixed; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: var(--w); color: var(--red); display: grid; place-items: center; font: 11px 'MW', system-ui; text-transform: uppercase; letter-spacing: .14em; pointer-events: none; z-index: 40; transform: scale(0); transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.cur.on { transform: scale(1); }
.cur.red { background: var(--red); color: var(--w); }
@media (hover: hover) and (pointer: fine) { .strip { cursor: none; } }

@media (max-width: 760px) { .strip img, .strip video { height: auto; max-height: 62svh; width: auto; max-width: calc(100vw - 2 * var(--pad)); } .pj.full .strip figure { width: calc(100vw - 2 * var(--pad)); height: 70svh; } .ttl h2 { font-size: 14vw; } .wall .row img { height: 19svh; } }
@media (prefers-reduced-motion: reduce) { .wall .row, .ttl div, .ttl h2::after { animation: none; } .hero h1 span { animation: none; transform: none; opacity: 1; } }
</style>

<div class="prog" id="prog"></div>
<header class="hero paper">
  <div class="wall" id="wall" aria-hidden="true"><div class="row"></div><div class="row"></div><div class="row"></div></div>
  <h1><span>The</span><span>portfolio</span></h1>
  <p>Brand, web, campaigns, motion and editorial</p>
  <div class="chips" role="group" aria-label="Filter"><button class="on" data-g="all">All</button><button data-g="Brand">Brand</button><button data-g="Web Design">Web Design</button><button data-g="Campaigns & Social">Campaigns &amp; Social</button><button data-g="Editorial & Packaging">Editorial &amp; Packaging</button><button data-g="Motion">Motion</button><button data-g="AI">AI</button></div>
</header>
<main id="m"></main>
<div class="cur" id="cur" aria-hidden="true">Drag</div>
<script>
(async () => {
  // Projects come from the home page, so this page never goes out of date.
  const html = await fetch('../').then(r => r.text());
  const P = JSON.parse(html.match(/const PROJECTS = (\[.*?\]);\n/s)[1]);
  const byId = Object.fromEntries(P.map((p, k) => [p.id, Object.assign(p, { k })]));
  // Curated picks and the videos the home page plays elsewhere
  const NOTE = { pocoyo: 'I designed everything: the patterns on the clothes, every product and all the AI images.' };
  // Pocoyo: the AI photos of the products at the end of the guide, then the best guide pages
  const SKIP = { vandido: ['02', '03', '04'] };  // 02 repeats 01; 03 is Fitz and 04 is Bonded (each has its own section)
  const PICKS = { pocoyo: ['guide-29', 'guide-39', 'guide-09'] };
  const FIRST = { pocoyo: ['p63_01', 'p65_01', 'p67_02', 'p71_01', 'p72_01', 'p73_01', 'p64_01', 'p68_01', 'p61_01'].map(n => `img/labs/ai/pcy-${n}.webp`) };
  const V = s => [`video/${s}.mp4`];
  if (byId.benedetto) byId.benedetto.img.unshift(V('oktopus-benedetto5'));
  const extra = [
    { id: 'motion', name: 'Motion', genres: ['Motion', 'Campaigns & Social'],
      img: ['oktopus-morris', 'oktopus-fortuny-fashionweek', 'oktopus-casapacha', 'oktopus-morris-beach', 'oktopus-chamanes', 'oktopus-soulempire', 'oktopus-morris-marbella', 'oktopus-chamanes-2', 'oktopus-flow-catalog---easter-eggs', 'oktopus-morris-lineup-junio1', 'oktopus-lineup-julio1', 'oktopus-morris-dinner1'].map(V) },
  ];
  const AIG = 'AI';
  // AI projects: read from the home's AI section, so texts and images stay in sync (EN and ES)
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const ai = [...doc.querySelectorAll('#lab-wall article')].map(a => ({
    id: 'ai-' + a.querySelector('h3').textContent, name: a.querySelector('h3').textContent.trim(), genres: [AIG], ai: true,
    note: a.querySelector('.lp2-c')?.textContent.trim(),
    text: [...a.querySelectorAll('.lp2-text p:not(.lp2-c)')].map(p => p.textContent.trim()).filter(Boolean),
    img: [...a.querySelectorAll('img, video')].map(e => [e.getAttribute('src')]).filter(x => x[0]) }));
  const list = [];
  P.forEach(p => {
    if (p.id === 'lab-reels') list.push({ ...p, name: 'AI Reels', genres: ['Motion', AIG] });
    else if (p.id === 'lab-web') list.push({ ...p, name: 'Websites you own', genres: ['Web Design', AIG], text: p.text.map(t => t.replace(/<[^>]+>/g, '')) });
    else if (!p.lab) list.push(p);
    if (p.id === 'miravia') list.push(...extra);  // motion lands early, right after the first big campaign
  });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const isV = s => /\.mp4$/.test(s);
  const poster = s => s.replace('video/', 'img/motion/p/').replace('.mp4', '.webp');
  const media = (src, alt) => isV(src)
    ? `<video data-src="../${src}" data-poster="../${poster(src)}" muted loop autoplay playsinline preload="none" aria-label="${esc(alt)}"></video>`
    : `<img src="../${src}" alt="${esc(alt)}" loading="lazy" decoding="async">`;
  const seen = new Set();
  const m = document.getElementById('m');
  list.push(...ai);
  m.innerHTML = list.map((p, i) => {
    let imgs = p.img.map(x => x[0]).filter(s => !seen.has(s) && seen.add(s));
    if (SKIP[p.id]) imgs = imgs.filter(s => !SKIP[p.id].some(n => s.endsWith('/' + n + '.webp')));
    if (PICKS[p.id]) imgs = PICKS[p.id].map(n => imgs.find(s => s.endsWith('/' + n + '.webp'))).filter(Boolean);
    if (FIRST[p.id]) imgs = [...FIRST[p.id], ...imgs];
    const t = Array(4).fill(`<h2>${esc(p.name)}</h2>`).join('');
    return `<section class="pj${i % 2 ? '' : ' alt'}${p.genres.includes('Motion') ? ' full' : ''}" data-g="${esc(p.genres.join('|'))}">
      <div class="ttl" aria-label="${esc(p.name)}"><div style="--t:${16 + p.name.length * 1.2}s">${t}${t}</div></div>
      <div class="pj-h"><p class="g">${p.genres.map(g => `<span>${esc(g)}</span>`).join('')}</p>${p.text && p.text.length ? `<button type="button" class="open" aria-expanded="false" data-t="Close">Read the case</button>` : ''}</div>
      ${p.text && p.text.length ? `<div class="case" hidden><p>${esc(p.text[0])}</p>${p.url ? `<a class="site" href="${esc(p.url)}" target="_blank" rel="noopener">Visit the site</a>` : ''}</div>` : ''}
      ${NOTE[p.id] || p.note ? `<p class="note">${esc(NOTE[p.id] || p.note)}</p>` : ''}
      <div class="strip">${imgs.map(s => `<figure${isV(s) ? ' class="vid"' : ''}>${media(s, p.name)}${isV(s) ? '<button type="button" class="fs" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>' : ''}</figure>`).join('')}</div>
      ${imgs.length > 1 ? `<div class="snav"><i class="sbar"><b></b></i><span class="sn">01 / ${String(imgs.length).padStart(2, '0')}</span><button type="button" class="sc prev" aria-label="Previous" disabled></button><button type="button" class="sc next" aria-label="Next"></button></div>` : ''}
    </section>`;
  }).join('');

  // Read the case: opens right here, no leaving the portfolio
  m.querySelectorAll('.open').forEach(b => b.onclick = () => {
    const c = b.closest('.pj').querySelector('.case'), o = c.hidden;
    c.hidden = !o; b.setAttribute('aria-expanded', o);
    [b.textContent, b.dataset.t] = [b.dataset.t, b.textContent];
  });

  // Hero wall: a moving collage of the best stills
  const wallImgs = ['pocoyo/guide-29', 'miravia/01', 'clarity/01', 'pocoyo/guide-39', 'argen/01', 'quantum/01', 'camomilla/01', 'popeyes/01', 'pocoyo/guide-09', 'vandido/01', 'proarte/01', 'ucles/01'];
  const rows = document.querySelectorAll('#wall .row');
  [wallImgs.slice(0, 4), wallImgs.slice(4, 8), wallImgs.slice(8)].forEach((g, r) => {
    const h = g.map(s => `<img src="../img/p/${s}.webp" alt="" decoding="async" onerror="this.remove()">`).join('');
    rows[r].innerHTML = h + h;
  });

  // Reveal on scroll; videos load and play only while on screen
  const io = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target.querySelector('video');
    if (e.isIntersecting) {
      if (v) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); }
    } else if (v) v.pause();
  }), { rootMargin: '400px 300px 400px 300px', threshold: .01 } /* 12/11: no cover image; videos load early and play by themselves */);
  document.querySelectorAll('.strip figure').forEach(f => io.observe(f));

  // Phone: each strip nudges once so it's clear it scrolls sideways
  if (matchMedia('(pointer: coarse)').matches) {
    const nio = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; nio.unobserve(e.target); const s = e.target; if (s.scrollLeft > 4 || s.dataset.used) return; s.scrollTo({ left: 90, behavior: 'smooth' }); setTimeout(() => { if (!s.dataset.used && s.scrollLeft <= 92) s.scrollTo({ left: 0, behavior: 'smooth' }); }, 700); /* 12/11: never undo a strip someone already moved */ }), { threshold: .6 });
    document.querySelectorAll('.strip').forEach(s => nio.observe(s));
  }

  // Drag to scroll + custom cursor on desktop
  const cur = document.getElementById('cur');
  addEventListener('pointermove', e => { cur.style.left = e.clientX + 'px'; cur.style.top = e.clientY + 'px'; }, { passive: true });
  document.querySelectorAll('.strip').forEach(s => {
    let x0 = 0, l0 = 0, down = false, moved = false;
    s.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { cur.classList.add('on'); cur.classList.toggle('red', s.closest('.pj').classList.contains('alt')); } });
    s.addEventListener('pointerleave', () => cur.classList.remove('on'));
    s.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; moved = false; x0 = e.clientX; l0 = s.scrollLeft; e.preventDefault(); });
    addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - x0; if (Math.abs(dx) > 4) { moved = true; s.classList.add('drag'); } s.scrollLeft = l0 - dx; });
    addEventListener('pointerup', () => { if (!down) return; down = false; s.classList.remove('drag'); });
    s.addEventListener('click', e => { if (moved) e.preventDefault(); }, true);
  });

  // Full screen: every video of the section, swipe between them, with sound (vv.js)
  m.addEventListener('click', e => {
    const b = e.target.closest('.fs'); if (!b) return;
    const sec = b.closest('.pj'), all = [...sec.querySelectorAll('.strip .fs')];
    VV.open(all.map(x => { const v = x.parentElement.querySelector('video'); return { v: v.dataset.src, s: v.dataset.poster }; }), all.indexOf(b), null, sec.querySelector('.ttl').getAttribute('aria-label'));
  });

  // Slider nav, same as JNPR Labs: progress line, 01 / 07, chevrons
  document.querySelectorAll('.pj').forEach(sec => {
    const st = sec.querySelector('.strip'), nv = sec.querySelector('.snav'); if (!nv) return;
    const fs = [...st.children], n = fs.length, z = x => String(x).padStart(2, '0');
